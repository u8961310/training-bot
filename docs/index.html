<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研習小秘書</title>
<style>
:root{--bg:#f6f8f7;--ink:#1c2b22;--muted:#5f6b64;--card:#fff;--line:#dfe5e1;--brand:#16803c}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111827;--ink:#e5e7eb;--muted:#9ca3af;--card:#1f2937;--line:#374151;--brand:#4ade80}
}
:root[data-theme="dark"]{--bg:#111827;--ink:#e5e7eb;--muted:#9ca3af;--card:#1f2937;--line:#374151;--brand:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:40px 16px}
h1{margin:0;font-size:32px}
p.lead{color:var(--muted);margin:6px 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--brand)}
a.card b{display:block;font-size:18px;color:var(--brand)}
a.card span{color:var(--muted);font-size:14px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>研習小秘書</h1>
  <p class="lead">研習公告丟給 LINE，AI 幫你抄進 Google 日曆、開課前提醒你。全程免費，不用寫程式。</p>
  <div class="grid">
    <a class="card" href="handout.html"><b>📘 實作講義</b><span>第 0 關學會問 Gemini＋12 個步驟，60 分鐘架好自己的一套</span></a>
    <a class="card" href="handout.pdf"><b>🖨️ 講義 PDF</b><span>A4 列印版</span></a>
    <a class="card" href="poster.png"><b>🖼️ 介紹海報</b><span>一張圖看懂它在做什麼</span></a>
    <a class="card" href="https://github.com/u8961310/training-bot/blob/master/docs/training-bot.gs"><b>💾 程式碼</b><span>training-bot.gs，第 4 步複製貼上用</span></a>
  </div>
</main>
</body>
</html>
